[build]
  command = "npm run build"
  publish = "dist"

# Proxy des médias Supabase via notre domaine vérifié (requis par TikTok PULL_FROM_URL).
# Netlify n'interpole pas les variables d'env ici : la ref du projet Supabase est en dur.
[[redirects]]
  from = "/media-proxy/*"
  to = "https://hgdjtyiatzsboqhdetag.supabase.co/storage/v1/object/public/media/:splat"
  status = 200

# Fichier de vérification de domaine TikTok
[[redirects]]
  from = "/tiktok*.txt"
  to = "/tiktok*.txt"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
